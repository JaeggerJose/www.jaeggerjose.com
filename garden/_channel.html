<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Apply the saved theme before first paint (main.js loads deferred) -->
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(e){}</script>
  <title>Channel — Garden — Jaegger Jose</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Shippori+Mincho+B1:wght@400;700&family=Noto+Sans:ital,wght@0,300;0,400;1,300&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Shippori+Mincho+B1:wght@400;700&family=Noto+Sans:ital,wght@0,300;0,400;1,300&display=swap"></noscript>
  <link rel="stylesheet" href="/css/style.css?v=14">
  <link rel="stylesheet" href="/css/garden.css?v=2">
</head>
<body class="page-garden">
  <a class="skip-link" href="#garden-main">SKIP TO CONTENT</a>


  <!-- Navigation -->
  <nav id="nav" aria-label="Main navigation">
    <a class="nav-logo" href="/">Ming-Hsuan Liao<span>廖洺玄</span></a>
    <ul class="nav-links">
      <li><a href="/works.html">Selected work</a></li>
      <li><a href="/#about">About</a></li>
      <li><a href="/#work">Experience</a></li>
      <li><a href="/#contact">Contact <span aria-hidden="true">↗</span></a></li>
    </ul>
    <div class="nav-right">
      <button class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">◐ Dark</button>
      <button class="nav-menu" id="nav-menu" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobile-menu" hidden>
    <p class="menu-eyebrow">A little directory</p>
    <a href="/works.html" class="mm-link">Selected work</a>
    <a href="/#about" class="mm-link">About</a>
    <a href="/#work" class="mm-link">Experience</a>
    <a href="/#contact" class="mm-link">Contact ↗</a>
    <button class="theme-toggle-mm" id="theme-toggle-mm" aria-label="Switch to dark theme">◐ Dark</button>
  </div>

  <main class="garden-main" id="garden-main">
    <nav class="channel-breadcrumb">
      <a href="/garden/">← GARDEN</a>
      <span> / </span>
      <span id="channel-name">…</span>
    </nav>

    <section class="garden-hero garden-channel-hero">
      <h1 class="garden-title" id="channel-title">…</h1>
      <p class="garden-subtitle" id="channel-summary"></p>
    </section>

    <section class="garden-block-grid" id="block-grid" aria-busy="true">
      <p class="garden-empty">loading…</p>
    </section>

    <section class="garden-channel-tags" id="channel-tags" hidden>
      <h2>Tags in this channel</h2>
      <div id="tag-cloud"></div>
    </section>
  </main>

  <dialog id="block-modal" class="garden-modal garden-block-modal">
    <button class="modal-close" aria-label="close">×</button>
    <div id="block-modal-body"></div>
  </dialog>

  <dialog id="block-form-modal" class="garden-modal">
    <form method="dialog" id="block-form">
      <h2 id="block-form-title">New Block</h2>
      <fieldset>
        <legend>Type</legend>
        <label><input type="radio" name="type" value="link" checked> Link</label>
        <label><input type="radio" name="type" value="image"> Image</label>
        <label><input type="radio" name="type" value="note"> Note</label>
      </fieldset>

      <div data-type-field="link">
        <label>URL
          <div style="display:flex; gap:0.4rem;">
            <input name="url" type="url" placeholder="https://...">
            <button type="button" id="og-fetch-btn">→ Fetch</button>
          </div>
        </label>
        <label>OG Image URL
          <input name="og_image" type="url" placeholder="auto-filled">
        </label>
      </div>

      <div data-type-field="image">
        <label>Image File
          <input name="image_file" type="file" accept="image/*">
        </label>
      </div>

      <label>Title <input name="title"></label>
      <label>Body / Comment <textarea name="body" rows="3"></textarea></label>
      <label>Tags (comma-separated)
        <input name="tags" placeholder="typography, print">
      </label>
      <label>Position <input name="position" type="number" value="0"></label>

      <div class="garden-modal-actions">
        <button value="cancel" type="reset">Cancel</button>
        <button value="confirm" type="submit">Publish</button>
      </div>
    </form>
  </dialog>

  <div class="auth-bar" id="auth-bar" style="display:none;">
    <span id="auth-user"></span>
    <button id="new-block-btn">+ NEW BLOCK</button>
    <button id="signout-btn">SIGN OUT</button>
  </div>
  <button class="auth-trigger" id="auth-trigger" aria-label="admin login">·</button>

  <dialog id="login-modal" class="garden-modal">
    <form method="dialog" id="login-form">
      <h2>Admin Login</h2>
      <label>Email <input name="email" type="email" required></label>
      <label>Password <input name="password" type="password" required></label>
      <div class="garden-modal-actions">
        <button value="cancel" type="reset">Cancel</button>
        <button value="confirm" type="submit">Sign in</button>
      </div>
    </form>
  </dialog>

  <script defer src="/js/vendor/supabase-2.117.2.js"></script>
  <script defer src="/js/main.js?v=11"></script>
  <script defer src="/js/garden-channel.js?v=2"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
